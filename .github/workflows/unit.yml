name: Unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_lab
      - run: python -m py_compile lab.py probe_limit.py test_lab.py
      - run: bash -n setup.sh run-all.sh kafka-start.sh scripts/*.sh
